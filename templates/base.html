<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ ui.site_title }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo {{ ui.site_title }}">
        <span class="brand-text">{{ ui.site_title }}</span>
      </a>
      <nav class="nav" aria-label="{{ 'Navegação principal' if lang == 'pt' else 'Navigation principale' }}">
        <a href="{{ url_for('index') }}">{{ ui.nav_home }}</a>
        <a href="{{ url_for('geografia') }}">{{ ui.nav_geography }}</a>
        <a href="{{ url_for('dados') }}">{{ ui.nav_data }}</a>
        <a href="{{ url_for('variedades') }}">{{ ui.nav_varieties }}</a>
        <a href="{{ url_for('historia') }}">{{ ui.nav_history }}</a>
        <a href="{{ url_for('poesias') }}">{{ ui.nav_poetry }}</a>
        <a href="{{ url_for('sobre') }}">{{ ui.nav_about }}</a>
      </nav>
      <div class="lang-switch">
        <a href="{{ url_for('set_lang', l='pt') }}" class="lang-link {{ 'active' if lang == 'pt' else '' }}">🇧🇷 PT</a>
        <a href="{{ url_for('set_lang', l='fr') }}" class="lang-link {{ 'active' if lang == 'fr' else '' }}">🇫🇷 FR</a>
      </div>
    </div>
  </header>

  <main class="container main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>🇧🇷 {{ ui.site_title }} — {{ ui.footer_note }}</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/tts.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
